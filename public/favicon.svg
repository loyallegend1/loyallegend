<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111729"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#e6a82c"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- football (soccer ball) -->
  <g transform="translate(32 30)">
    <circle r="18" fill="#e6edf7" stroke="#0a0e1a" stroke-width="1.5"/>
    <!-- pentagon at center -->
    <polygon points="0,-7 6.66,-2.16 4.11,5.66 -4.11,5.66 -6.66,-2.16" fill="#0a0e1a"/>
    <!-- five spokes from pentagon -->
    <line x1="0" y1="-7"      x2="0" y2="-15"     stroke="#0a0e1a" stroke-width="1.5"/>
    <line x1="6.66" y1="-2.16"  x2="14.27" y2="-4.65" stroke="#0a0e1a" stroke-width="1.5"/>
    <line x1="4.11" y1="5.66"   x2="8.82" y2="12.14" stroke="#0a0e1a" stroke-width="1.5"/>
    <line x1="-4.11" y1="5.66"  x2="-8.82" y2="12.14" stroke="#0a0e1a" stroke-width="1.5"/>
    <line x1="-6.66" y1="-2.16" x2="-14.27" y2="-4.65" stroke="#0a0e1a" stroke-width="1.5"/>
  </g>

  <!-- gold "LEGENDARY" bottom bar nod to the brand -->
  <rect x="0" y="56" width="64" height="8" fill="url(#gold)"/>
</svg>
