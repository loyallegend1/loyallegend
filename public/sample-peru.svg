<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#111729"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#1f2940"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"  stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#e6a82c"/>
    </linearGradient>
  </defs>

  <!-- card body -->
  <rect width="480" height="600" rx="24" fill="url(#bg)" stroke="#1f2940" stroke-width="2"/>

  <!-- header -->
  <g transform="translate(24 36)">
    <!-- Peru flag (red | white | red vertical stripes) -->
    <g transform="translate(0 -8)">
      <rect x="0"  y="0" width="14" height="36" fill="#d91023"/>
      <rect x="14" y="0" width="14" height="36" fill="#ffffff"/>
      <rect x="28" y="0" width="14" height="36" fill="#d91023"/>
    </g>
    <text x="56" y="20" fill="#e6edf7" font-family="Impact, 'Bebas Neue', sans-serif" font-size="28" letter-spacing="3">PERU</text>
    <text x="408" y="20" fill="#8a96b2" font-family="ui-monospace, monospace" font-size="18" text-anchor="end">#4</text>
  </g>

  <!-- center "image area" with field grid -->
  <g transform="translate(24 80)">
    <rect width="432" height="324" rx="16" fill="url(#frame)"/>
    <rect width="432" height="324" rx="16" fill="url(#grid)"/>
    <!-- big flag in the center -->
    <g transform="translate(150 86)">
      <rect x="0"   y="0" width="44" height="150" fill="#d91023"/>
      <rect x="44"  y="0" width="44" height="150" fill="#ffffff"/>
      <rect x="88"  y="0" width="44" height="150" fill="#d91023"/>
    </g>
  </g>

  <!-- stats -->
  <g transform="translate(24 440)" font-family="Inter, system-ui, sans-serif">
    <text x="0"   y="0" fill="#8a96b2" font-size="18">FIFA Rank</text>
    <text x="432" y="0" fill="#e6edf7" font-size="20" font-weight="600" text-anchor="end">#4</text>
    <text x="0"   y="32" fill="#8a96b2" font-size="18">Points</text>
    <text x="432" y="32" fill="#e6edf7" font-size="20" font-weight="600" text-anchor="end">2,164</text>
  </g>

  <!-- LEGENDARY bottom bar -->
  <g>
    <rect x="0" y="540" width="480" height="60" fill="url(#gold)"/>
    <text x="240" y="580" fill="#0a0e1a" font-family="Impact, 'Bebas Neue', sans-serif" font-size="28" letter-spacing="12" text-anchor="middle">LEGENDARY</text>
  </g>

  <!-- corner rounded mask: we use a clipPath via rx on the body rect, plus
       redrawing the bar above with the same body rx works because the bottom
       portion of the gold rect is naturally clipped at y=600. -->
</svg>
